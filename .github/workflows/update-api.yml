name: Update API Stats

on:
  schedule:
    # Every 6 hours (UTC): 00:00, 06:00, 12:00, 18:00
    - cron: '0 */6 * * *'
  workflow_dispatch: # Manual trigger

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client-web/package-lock.json

      # 1. Update API data from chain
      - name: Fetch on-chain data
        run: node scripts/update-api.mjs

      # 2. Commit changes (if any)
      - name: Commit API updates
        run: |
          git diff --quiet client-web/public/api/ && exit 0
          git config user.name "pumpclaw-bot"
          git config user.email "bot@pumpclaw.com"
          git add client-web/public/api/
          TOKENS=$(jq .totalTokens client-web/public/api/v1/stats.json)
          CREATORS=$(jq .uniqueCreators client-web/public/api/v1/stats.json)
          git commit -m "📊 API update: ${TOKENS} tokens, ${CREATORS} creators"
          git push

      # 3. Build frontend (includes updated API files)
      - name: Install dependencies
        working-directory: client-web
        run: npm ci

      - name: Build
        working-directory: client-web
        run: npm run build

      # 4. Deploy to GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: client-web/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
